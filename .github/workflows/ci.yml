name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TSX_DISABLE_CACHE: "1"
      NODE_DISABLE_COMPILE_CACHE: "1"
    steps:
      - name: Prepare external test workspace
        run: |
          workspace="$RUNNER_TEMP/ubc-tmp"
          install -d -m 700 "$workspace"
          printf 'UBC_TMP_ROOT=%s\nTMPDIR=%s\n' "$workspace" "$workspace" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install native document test tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils python3 util-linux

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --no-file-parallelism --maxWorkers=1

      - name: Validate host documents
        run: npm run validate:hosts

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check
