name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TMPDIR: /home/admin2/Projects/ubc-tmp
      TSX_DISABLE_CACHE: "1"
      NODE_DISABLE_COMPILE_CACHE: "1"
    steps:
      - name: Prepare external test workspace
        run: sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$TMPDIR"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Validate host documents
        run: npm run validate:hosts

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check
