name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TSX_DISABLE_CACHE: "1"
      NODE_DISABLE_COMPILE_CACHE: "1"
    steps:
      - name: Prepare external test workspace
        run: |
          workspace="$HOME/ubc-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 700 "$workspace"
          printf 'UBC_TMP_ROOT=%s\nTMPDIR=%s\n' "$workspace" "$workspace" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install native document test tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils python3 util-linux

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Audit complete test inventory
        run: npm run test:inventory

      - name: Portable tests on Ubuntu and Node 24
        run: npm run test:portable -- --no-file-parallelism --maxWorkers=1

      - name: State native qualification boundary
        if: always()
        run: |
          printf '%s\n' \
            '### Native-runtime qualification' \
            'This Ubuntu job runs the portable test lane, not the fixed-profile native lane.' \
            'The full npm test command still includes both lanes. Inventory validation prevents lost or duplicated tests.' \
            'Native qualification must run on the reviewed CachyOS/Linux x86-64 toolchain and be reported separately for the release commit.' \
            'A portable CI success is not evidence of native execution. See HOST-DOCUMENTS.md for commands and requirements.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Validate categorized host documents
        run: npm run validate:hosts -- --require-categories

      - name: Validate prose documents
        run: npm run validate:prose

      - name: Validate undergraduate facts
        run: npm run validate:undergrad

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check
